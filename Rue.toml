[compiler]
version = "0.11.0"
entrypoint = "puzzles"
dist_dir = "puzzles/dist"

[formatter]
max_width = 100
indent_width = 4

# Every lint is an error, so that the committed bytecode is always lint-free.
[lints]
unused_function = "deny"
unused_constant = "deny"
unused_binding = "deny"
unused_parameter = "deny"
unused_struct = "deny"
unused_type_alias = "deny"
unused_generic_type = "deny"
unused_import = "deny"
unused_value = "deny"
unused_struct_field = "deny"
unused_export = "deny"
empty_generics = "deny"
unnecessary_cast = "deny"
unnecessary_guard = "deny"
indistinguishable_guard = "deny"
unnecessary_plus = "deny"
unnecessary_return = "deny"
constant_condition = "deny"
double_negation = "deny"
unreachable_code = "deny"
inline_if_may_raise = "deny"
self_comparison = "deny"
identical_branches = "deny"
duplicate_condition = "deny"
bool_comparison = "deny"
needless_bool = "deny"
negated_condition = "deny"
collapsible_if = "deny"
manual_assert = "deny"
needless_let_return = "deny"
redundant_field_names = "deny"
unnecessary_parens = "deny"
naming_convention = "deny"
shadowed_binding = "deny"
debug_statement = "deny"
unconditional_recursion = "deny"
redundant_inline = "deny"
large_inline = "deny"
repeated_expensive_call = "deny"
bytes_int_confusion = "deny"
unknown_lint = "deny"
unfulfilled_lint_expectation = "deny"
